draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30.0
  n_columns: 1
  dark_mode: auto

  # Необязательно, но улучшает читаемость комбо
  arc_radius: 6.0

parse_config:
  zmk_preamble: |
    #define BASE 0
    #define NAV  1
    #define MOUSE 2
    #define NUM  3

  raw_binding_map:
    # ==========================================
    # 1. БАЗОВЫЕ КЛАВИШИ И МОДИФИКАТОРЫ
    # ==========================================
    "&kp ESC": "ESC"
    "&kp BSPC": "⌫"
    "&kp DEL": "DEL"
    "&kp LSHIFT": "Shift"
    "&kp RSHIFT": "Shift"
    "&kp LCTRL": "Ctrl"
    "&kp RCTRL": "Ctrl"
    "&kp LALT": "Alt"
    "&kp RALT": "Alt"
    "&kp LGUI": "Gui"
    "&kp RGUI": "Gui"
    "&kp TAB": "Tab"
    "&kp ENTER": "Enter"
    "&kp SPACE": "␣"
    "&kp CAPSLOCK": "Caps"
    "&bootloader": "BOOT"
    "&sys_reset": "RESET"

    # ==========================================
    # 2. БУКВЫ (ДВОЙНЫЕ ЛЕГЕНДЫ EN RU)
    # ==========================================
    "&kp Q": "Q Й"
    "&kp W": "W Ц"
    "&kp E": "E У"
    "&kp R": "R К"
    "&kp T": "T Е"
    "&kp Y": "Y Н"
    "&kp U": "U Г"
    "&kp I": "I Ш"
    "&kp O": "O Щ"
    "&kp P": "P З"
    "&kp A": "A Ф"
    "&kp S": "S Ы"
    "&kp D": "D В"
    "&kp F": "F А"
    "&kp G": "G П"
    "&kp H": "H Р"
    "&kp J": "J О"
    "&kp K": "K Л"
    "&kp L": "L Д"
    "&kp Z": "Z Я"
    "&kp X": "X Ч"
    "&kp C": "C С"
    "&kp V": "V М"
    "&kp B": "B И"
    "&kp N": "N Т"
    "&kp M": "M Ь"

    # ==========================================
    # 3. ЗНАКИ ПРЕПИНАНИЯ (BASE LAYER)
    # ==========================================
    # Формат: "Shift Base" (или триплет, если влезает)
    "&kp LBKT": "[ Х"
    "&kp RBKT": "] Ъ"
    "&kp SEMI": "; Ж"
    "&kp SQT": "' Э"
    "&kp COMMA": ", Б"
    "&kp DOT": ". Ю"
    "&kp FSLH": "/ ."
    "&kp BSLH": "\\"
    "&kp GRAVE": "' \" `"  # кастомная клавиша
    "&kp MINUS": "- _"
    "&kp EQUAL": "= +"

    # "Призрачные" клавиши для хардкода . и ,
    "&kp NUBS": "< ,"
    "&kp INT3": "> ."

    # ==========================================
    # 4. СЛОЙ NAV & MOUSE & MEDIA
    # ==========================================
    "&kp LG(LC(Q))": "logOut"
    "&kp LG(LS(Z))": "Redo"
    "&kp LG(V)": "Paste"
    "&kp LG(C)": "Copy"
    "&kp LG(X)": "Cut"
    "&kp LG(Z)": "Undo"

    "&kp INS": "Insert"
    "&kp HOME": "Home"
    "&kp END": "End"
    "&kp PG_UP": "PgUp"
    "&kp PG_DN": "PgDn"
    "&kp LEFT": "←"
    "&kp DOWN": "↓"
    "&kp UP": "↑"
    "&kp RIGHT": "→"

    "&kp LG(LS(N3))": "Scr Full"
    "&kp LG(LS(N4))": "Scr Area"
    "&kp LG(FSLH)": "IDE Comment Code"

    "&mmv MOVE_LEFT": "Ms ←"
    "&mmv MOVE_DOWN": "Ms ↓"
    "&mmv MOVE_UP": "Ms ↑"
    "&mmv MOVE_RIGHT": "Ms →"
    "&msc SCRL_LEFT": "Scr ←"
    "&msc SCRL_DOWN": "Scr ↓"
    "&msc SCRL_UP": "Scr ↑"
    "&msc SCRL_RIGHT": "Scr →"
    "&mkp LCLK": "L Click"
    "&mkp RCLK": "R Click"
    "&mkp MCLK": "M Click"
    "&kp C_VOL_UP": "Vol +"
    "&kp C_VOL_DN": "Vol -"
    "&kp C_MUTE": "Mute"

    # ==========================================
    # 5. СЛОЙ NUM (ЛЕВАЯ РУКА - CALC)
    # ==========================================
    # Здесь используем стандартные коды (не RA)
    "&kp PLUS": "+"
    "&kp MINUS": "-"
    "&kp ASTRK": "*"
    "&kp EQUAL": "="
    "&kp PRCNT": "%"

    # Исключения на Option
    "&kp RA(G)": "/"
    "&kp RA(V)": "."

    # ==========================================
    # 6. СЛОЙ NUM (ПРАВАЯ РУКА - CODE)
    # ==========================================
    # Ряд 1 (Y U I O P) -> & { } " |
    "&kp RA(Y)": "&"
    "&kp RA(U)": "{"
    "&kp RA(I)": "}"
    "&kp RA(O)": "\""
    "&kp RA(P)": "|"

    # Ряд 2 (H J K L ;) -> _ ( ) : !
    "&kp UNDER": "_"    # Вернули стандартный код
    "&kp RA(J)": "("
    "&kp RA(K)": ")"
    "&kp RA(L)": ":"
    "&kp RA(SEMI)": "!"

    # Ряд 3 (N M , . /) -> ^ [ ] < >
    "&kp RA(N)": "^"
    "&kp RA(M)": "["
    "&kp RA(COMMA)": "]"
    "&kp RA(DOT)": "<"
    "&kp RA(FSLH)": ">"

    # ==========================================
    # 7. КОМБО (COMBOS)
    # ==========================================
    # Русские буквы
    "&kp LBKT": "[ Х" # Используется и как кнопка, и как результат комбо

    # Символы на слое NUM
    "&kp RA(SQT)": "'"
    "&kp RA(GRAVE)": "`"
    "&kp RA(S)": ";"
    "&kp RA(W)": "@"
    "&kp RA(E)": "#"
    "&kp RA(R)": "$"
    "&kp RA(D)": "~"
    "&kp RA(F)": "\\"